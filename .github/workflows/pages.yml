name: Deploy landing preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 검사는 `npm test` 하나로 돈다. 여기에 개별 스크립트를 나열해 두면
      # 새 검사를 추가할 때마다 이 파일을 같이 고쳐야 하고, 잊으면 **로컬에서는
      # 도는 검사가 배포 길목에서만 빠진다** — 실제로 문의 중계 검사가 그렇게 빠져 있었다.
      #
      # 이 검사들이 막는 것: 표현 제약 위반(IB-2 6절 / IB-6 / IB-8), 리드가
      # 아무 데도 저장되지 않았는데 접수됐다고 답하는 회귀, 문의 중계의 답장 오배송.
      # 전부 가짜 텔레그램 서버로 돌아서 외부 비밀값이 필요 없다.
      - name: Run checks
        run: npm test

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp -r public/* _site/
          # 정적 배포에는 리드 수집 서버가 없다. 프리뷰용 설정으로 갈아끼운다.
          cp deploy/config.preview.js _site/config.js
          # Jekyll 처리를 건너뛴다 (밑줄로 시작하는 파일 보존).
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
