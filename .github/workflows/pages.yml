name: Deploy landing preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 표현 제약 위반은 배포를 막는다. 잘못된 문구가 라이브로 나가는 것이
      # 배포가 늦어지는 것보다 비싸다 (IB-2 6절 / IB-6 / IB-8).
      - name: Check landing copy constraints
        run: node scripts/copy-guard.mjs

      # 리드 접수 경로가 "아무 데도 저장 안 됐는데 접수됐다고 답하는" 상태로
      # 회귀하지 않는지 확인한다. 가짜 텔레그램 서버를 띄워서 도는 검사라
      # 외부 비밀값이 필요 없다.
      - name: Test lead intake path
        run: node scripts/smoke-serverless.mjs

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp -r public/* _site/
          # 정적 배포에는 리드 수집 서버가 없다. 프리뷰용 설정으로 갈아끼운다.
          cp deploy/config.preview.js _site/config.js
          # Jekyll 처리를 건너뛴다 (밑줄로 시작하는 파일 보존).
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
